spring:
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    consumer:
      group-id: homehub-service-group
    producer:
      transaction-id-prefix: homehub-tx-

kafka:
  topics:
    society-registration-requested: ${KAFKA_TOPICS_SOCIETY_REGISTRATION:society.registration.requested}
    service-request-created: ${KAFKA_TOPICS_SERVICE_REQUEST:service.request.created}
    # Add other topics as needed

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: always